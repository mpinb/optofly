[package]
name = "optofly-camera"
version = "0.1.0"
edition = "2021"

[dependencies]
xiapi = { git = "https://github.com/Ximea-GmbH/xiapi.git" }
zmq = "0.10"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
csv = "1.3"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde_json = "1"
ctrlc = "3.4"
