[project]
name = "optofly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2",
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "opencv-python>=4.13.0.92",
    "optotune-lens",
    "panda3d>=1.10.0",
    "pyserial>=3.5",
    "pyzmq>=26.4.0",
    "requests>=2.32.3",
    "rerun-sdk>=0.23.2",
    "scipy>=1.15.3",
    "ximea @ git+https://github.com/elhananby/ximea-py.git",
]

[dependency-groups]
dev = [
    "ipython>=8.38.0",
    "optofly",
    "pytest>=8.4.2",
    "ruff",
    "tomli-w>=1.1.0",
]

[tool.uv.sources]
optofly = { workspace = true }
optotune-lens = { git = "ssh://git@github.com/elhananby/optotune-lens.git" }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "display: requires a usable display (DISPLAY env var) to run",
]

[tool.pyright]
typeCheckingMode = "off"
