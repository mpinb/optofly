<!DOCTYPE html>
<html>
    <head>
        OptoFly Remote Monitoring Dashboard
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        #trigger-count {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #trigger-log {
            border: 1px solid #555;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            background-color: #252526;
        }
        .trigger-entry {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #333;
        }
    </style>
    </head>

    <body>
        <h1>OptoFly Recording Monitor</h1>
        <div id = "trigger-count">Triggers: 0</div>
        <div id = "trigger-log"></div>

        <script>
            const eventSource = new EventSource("/stream");

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);

                // Update count
                document.getElementById("trigger-count").textContent = `Triggers: ${data.count}`;

                // Add new trigger entry
                const logDiv = document.getElementById("trigger-log");
                const entry = document.createElement("div");
                entry.className = "trigger-entry";
                entry.textContent = JSON.stringify(data.trigger, null, 2);
                logDiv.insertBefore(entry, logDiv.firstChild);
            };

            eventSource.onerror = function(err) {
                console.error("EventSource failed:", err);
            };
        </script>
    </body>

</html>
