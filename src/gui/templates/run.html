{% extends "base.html" %}
{% block content %}
<h1>Run Experiment</h1>

<div id="status-line"></div>

<button id="prepare-btn">Check Braid folder</button>
<span id="braid-folder"></span>

<form id="metadata-form">
    <input type="hidden" name="config_path" value="configs/config.toml">
    <label>Experimenter <input name="experimenter"></label><br>
    <label>Cross / genotype <input name="cross"></label><br>
    <label>Cross date <input name="cross_date" placeholder="YYYY-MM-DD"></label><br>
    <label>F1 date <input name="f1_date" placeholder="YYYY-MM-DD"></label><br>
    <label>ATR date <input name="atr_date" placeholder="YYYY-MM-DD"></label><br>
    <label>Experiment date <input name="experiment_date" placeholder="YYYY-MM-DD"></label><br>
    <label>Number of flies <input name="n_flies" type="number"></label><br>
    <label>Experiment duration (hours) <input name="experiment_duration" type="number" step="0.5" value="24"></label><br>
    <label>Notes <textarea name="notes"></textarea></label><br>
    <button type="submit" id="start-btn">Start</button>
</form>

<button id="stop-btn">Stop</button>

<div id="processes"></div>

<script>
document.getElementById("prepare-btn").addEventListener("click", async () => {
    const configPath = document.querySelector('[name="config_path"]').value;
    const resp = await fetch("/run/prepare", {
        method: "POST",
        body: new URLSearchParams({config_path: configPath}),
    });
    const data = await resp.json();
    document.getElementById("braid-folder").textContent = data.braid_folder || data.error;
});

document.getElementById("metadata-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const resp = await fetch("/run/start", {
        method: "POST",
        body: new URLSearchParams(new FormData(event.target)),
    });
    const data = await resp.json();
    document.getElementById("status-line").textContent = data.error || "Experiment started.";
});

document.getElementById("stop-btn").addEventListener("click", async () => {
    const resp = await fetch("/run/stop", {method: "POST"});
    const data = await resp.json();
    document.getElementById("status-line").textContent = data.error || "Experiment stopped.";
});

async function pollStatus() {
    const resp = await fetch("/api/status");
    const data = await resp.json();
    const processesDiv = document.getElementById("processes");
    processesDiv.innerHTML = Object.entries(data.processes)
        .map(([name, info]) => `<div>${info.alive ? "🟢" : "🔴"} ${name} ${info.failed_reason || ""}</div>`)
        .join("");
}
setInterval(pollStatus, 1000);
pollStatus();
</script>
{% endblock %}
