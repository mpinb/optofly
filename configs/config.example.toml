# ==============================================================================
# OPTOFLY CONFIGURATION
# ==============================================================================
# Main configuration file for the OptoFly closed-loop optogenetics system
# Documentation: https://github.com/elhananby/OptoFly

# ==============================================================================
# EXPERIMENT METADATA
# ==============================================================================
[metadata]
experimenter = "Your Name"
cross = "Genotype or Cross Info"
cross_date = "2023-12-31"
f1_date = "2023-11-30"
atr_date = "2024-01-01"
experiment_date = "2024-02-15"
n_flies = 10
notes = "Additional notes about the experiment."
experiment_duration = 24 # hours

# ==============================================================================
# SYSTEM CONFIGURATION
# ==============================================================================
[zmq]
# ZMQ messaging ports and topics
braid_port = 5555
trigger_port = 5556

braid_topic = "BRAID"
zone_enter_topic = "ZONE_ENTER"
zone_exit_topic = "ZONE_EXIT"

[logging]
# Global logging level
level = "INFO"

[monitoring]
active = true
host = "0.0.0.0"
port = 5000

# ==============================================================================
# TRACKING & DATA INPUT
# ==============================================================================

[braid_publisher]
# Braid tracking system connection
host = "127.0.0.1"
events_port = 8397     # Braid SSE/events endpoint (tracking data)
callback_port = 12345  # Braid UI endpoint (recording control)
timeout = 30
reconnect_delay = 5
experiments_path = "/mnt/data/experiments/"  # Root path where Braid saves .braid folders

[trigger_handler]
# Zone-based trigger detection
z_min = 0.15                     # Minimum z for trigger zone (meters)
z_max = 0.25                     # Maximum z for trigger zone (meters)
heading_cone_deg = 45.0          # Angular tolerance for heading alignment (degrees)
min_velocity = 0.01              # Minimum velocity to consider object "moving" (m/s)
zone_timeout = 2.0               # Auto ZONE_EXIT if no updates for this long (seconds)
refractory_period = 10.0         # Global cooldown between ZONE_ENTER events (seconds)
zone_dwell_time = 0.05           # Min time in zone before ZONE_ENTER fires (seconds)

[camera]
# High-speed camera settings
active = false
resolution = [2112, 2112]
fps = 500
exposure_time = 2000             # Microseconds
# Buffer sized automatically from trigger_handler.zone_timeout

[camera.FOV]
# Camera field of view in tracking coordinates (meters)
x_min = -0.07
x_max = 0.07
y_min = -0.045
y_max = 0.06

# ==============================================================================
# HARDWARE CONTROL
# ==============================================================================

[opto_trigger]
# LED optogenetic stimulation
active = false
port = "/dev/opto_trigger"
baudrate = 115200

# Stimulus parameters (single values or lists for randomization)
duration = [100, 200, 300]   # Pulse duration (ms)
# duration = [100, 200, 300, 400]  # Example: random selection

intensity = [  0,  51, 102, 153, 204, 255] # LED brightness (0-255)
# intensity = [128, 192, 255]    # Example: random intensity

frequency = 0                    # Pulse frequency (Hz, 0=continuous)
# frequency = [0, 10, 20, 50]    # Example: random frequency

color = "red"                    # LED color
sham_probability = 0.0           # Probability of sham trials (0.0-1.0)

[liquid_lens]
# Liquid lens auto-focus system (activates automatically with camera)
port = "/dev/ttyUSB1"
mode = "diopter"
calibration_file = "calibrations/liquid_lens.csv"
tracking_timeout = 3.0           # Stop adjusting if no tracking data (seconds)

[liquid_lens.kalman]
# Kalman filter for predictive focus
enabled = false
process_noise = 0.01             # How quickly velocity can change
measurement_noise = 0.1          # Accuracy of position measurements
initial_covariance = 1.0         # Uncertainty in initial state
system_latency = 0.05            # Message processing + lens adjustment time (seconds)
prediction_horizon = 0.1         # Prediction lookahead time (seconds)

# ==============================================================================
# VISUAL STIMULI
# ==============================================================================
# Visual stimuli configuration has been moved to configs/visual_stimuli.toml
# This keeps system config clean and allows easy experiment preset swapping

[visual_stimuli]
# Enable/disable visual stimuli system
active = true

# Path to visual stimuli configuration file
config_file = "configs/visual_stimuli.toml"
