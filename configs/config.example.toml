# ==============================================================================
# OPTOFLY CONFIGURATION
# ==============================================================================
# Main configuration file for the OptoFly closed-loop optogenetics system
# Documentation: https://github.com/elhananby/optofly

# ==============================================================================
# SYSTEM CONFIGURATION
# ==============================================================================
[zmq]
# ZMQ messaging ports and topics
braid_port = 5555
trigger_port = 5556
active_braid_port = 5557
# LatencyLogger's PULL bind port; OptoTriggerWorker/VisualProcess/LiquidLens
# each PUSH their LATENCY messages here (many-producer, one-consumer fan-in).
latency_port = 5558

braid_topic = "BRAID"
zone_enter_topic = "ZONE_ENTER"
zone_exit_topic = "ZONE_EXIT"
opto_enter_topic = "OPTO_ZONE_ENTER"
visual_enter_topic = "VISUAL_ZONE_ENTER"
active_braid_topic = "ACTIVE_BRAID"

# Full BRAID feed keeps a larger buffer for trigger/monitoring consumers.
braid_pub_hwm = 1000

# Liquid lens feed is latest-only to prevent stale focus commands.
lens_update_conflate = true

# Transport protocol: "tcp" works across machines; "ipc" is faster on a single host.
# transport = "ipc"

[logging]
# Global logging level
level = "INFO"

[monitoring]
active = true
host = "0.0.0.0"
port = 5000

# ==============================================================================
# TRACKING & DATA INPUT
# ==============================================================================

[braid_publisher]
# Braid tracking system connection
host = "127.0.0.1"
events_port = 8397     # Braid SSE/events endpoint (tracking data)
callback_port = 12345  # Braid UI endpoint (recording control)
timeout = 30
reconnect_delay = 5
experiments_path = "/mnt/data/experiments/"  # Root path where Braid saves .braid folders

[trigger_handler]
# Zone-based trigger detection
z_min = 0.10                     # Minimum z for trigger zone (meters)
z_max = 0.25                     # Maximum z for trigger zone (meters)
heading_cone_deg = 30.0          # Angular tolerance for heading alignment (degrees)
min_velocity = 0.01              # Minimum velocity to consider object "moving" (m/s)
max_velocity = 1.0               # Maximum velocity to filter noise (m/s)
min_tracking_age = 0.1           # Object must exist this long before triggering (seconds)
zone_timeout = 3.0               # Auto ZONE_EXIT if no updates for this long (seconds)
cooldown_period = 10.0         # Global cooldown between ZONE_ENTER events (seconds)
opto_zone_scale = 0.5           # Opto fires only once the fly reaches this fraction of the FOV, centered (0-1]
visual_zone_scale = 1.0         # Visual fires at this fraction of the FOV, centered (0-1]; 1.0 = same as camera FOV

[camera]
# High-speed camera settings
active = true
resolution = [2112, 2112]
fps = 500
exposure_time = 2000             # Microseconds
max_recording_time = 3.0         # Max seconds per recording (sizes buffer)

[camera.FOV]
# Camera field of view in tracking coordinates (meters).
# These values can be computed automatically with the BRAID-to-camera calibration tool
# (src/tools/calibrate_braid_ximea.py) — collect edge points with SPACE, press 'n' to
# finalise the plane, then 's' to save into configs/config.toml.
#
# Flat mode (default): single set of x/y bounds applied at all z heights.
x_min = -0.0218
x_max = 0.039
y_min = -0.025
y_max = 0.041

# Frustum mode (perspective-correct): define FOV at two z reference planes.
# The zone check interpolates x/y bounds at the fly's actual z, matching the
# real camera perspective. Generated automatically by:
#   uv run python -m src.tools.calibrate_frustum_fov --near-z 0.10 --far-z 0.25
# To enable manually, replace the flat keys above with these two sub-tables
# (remove x_min/x_max/y_min/y_max from [camera.FOV] first):
#
# [camera.FOV.near]
# z     = 0.10      # z where these bounds were measured
# x_min = -0.015
# x_max = 0.025
# y_min = -0.018
# y_max = 0.030
#
# [camera.FOV.far]
# z     = 0.25      # z where these bounds were measured
# x_min = -0.0218
# x_max = 0.039
# y_min = -0.025
# y_max = 0.041
# ==============================================================================
# HARDWARE CONTROL
# ==============================================================================

[opto_trigger]
# LED optogenetic stimulation
active = false
# NOTE: 'port' is required below even when active = false. AppConfig.load()
# validates every section on every load regardless of its active flag, so
# this key must stay present (even as a placeholder) or config loading
# fails for the whole file, not just this subsystem.
# 'port' must be a udev symlink pointing to the Arduino serial device.
# Create /etc/udev/rules.d/99-optofly.rules with a line like:
#   SUBSYSTEM=="tty", ATTRS{idVendor}=="2341", ATTRS{idProduct}=="0043", SYMLINK+="opto_trigger"
# Then reload: sudo udevadm control --reload && sudo udevadm trigger
port = "/dev/opto_trigger"
baudrate = 115200

# Stimulus parameters (single values or lists for randomization)
duration = [100, 200, 300]   # Pulse duration (ms)
# duration = [100, 200, 300, 400]  # Example: random selection

intensity = [  0,  51, 102, 153, 204, 255] # LED brightness (0-255)
# intensity = [128, 192, 255]    # Example: random intensity

frequency = 0                    # Pulse frequency (Hz, 0=continuous)
# frequency = [0, 10, 20, 50]    # Example: random frequency

color = "red"                    # LED color
sham_probability = 0.0           # Probability of sham trials (0.0-1.0)

[liquid_lens]
# Liquid lens auto-focus system (activates automatically with camera; no
# separate active flag of its own)
# NOTE: 'port' is required below even if camera is inactive/unused.
# AppConfig.load() validates every section on every load regardless of any
# other section's active flag, so this key must stay present (even as a
# placeholder) or config loading fails for the whole file.
# 'port' must be a udev symlink pointing to the Optotune ICC-1C controller.
# idVendor/idProduct below are TBD -- copied from the old Lens Driver 4 rule
# as a placeholder. Once an ICC-1C unit is on hand, check
# `udevadm info -a -n /dev/ttyUSBx` (or see it in `lsusb`) for its real
# values and update this rule before relying on it.
# Create /etc/udev/rules.d/99-optofly.rules with a line like:
#   SUBSYSTEM=="tty", ATTRS{idVendor}=="0403", ATTRS{idProduct}=="6001", SYMLINK+="optotune_icc1c"
# Then reload: sudo udevadm control --reload && sudo udevadm trigger
port = "/dev/optotune_icc1c"
mode = "diopter"
calibration_file = "calibrations/liquid_lens.csv"

# Model used to fit the z → diopter calibration curve (fit once at startup):
#   "linear"    — dpt = a·z + b                      (fast, R²≈0.94)
#   "quadratic" — dpt = a·z² + b·z + c               (recommended, R²≈0.995)
#   "power"     — dpt = a·z^b + c                    (physically motivated)
#   "inverse"   — dpt = a/(z − b) + c                (thin-lens theory)
calibration_model = "quadratic"

# Slew-rate limit: max change in commanded diopter per Braid update.
# The lens rings at ~400 Hz when given an abrupt step, so large jumps
# (especially the trial-onset jump) are ramped over several updates to avoid
# exciting the resonance. 0.0 disables limiting (raw steps, original behavior).
# Tune against fly speed + Braid rate: too small lags fast flies, too large
# still rings. Start around 0.1–0.2 and check focus on video.
max_diopter_step = 0.0

# Zone timeout is global (from [trigger_handler] section)

# Predictor mode — controls how the lens target depth is computed each update:
#   "none"   — use raw z from Braid directly (no lookahead)
#   "linear" — z + vz * (system_latency + prediction_horizon)
predictor = "none"

[liquid_lens.kalman]
# Prediction parameters — used by the "linear" predictor. Section name is
# kept for config-file compatibility (predates removal of a Kalman-filter
# predictor mode).
system_latency = 0.010           # Message processing + serial write time (seconds) — calibrate with lens_latency_analyze
prediction_horizon = 0.010       # Additional lookahead beyond system_latency (seconds)

# ==============================================================================
# VISUAL STIMULI
# ==============================================================================
# Visual stimuli configuration has been moved to configs/visual_stimuli.toml
# This keeps system config clean and allows easy experiment preset swapping

[visual_stimuli]
# Enable/disable visual stimuli system
active = true

# Path to visual stimuli configuration file
config_file = "configs/visual_stimuli.toml"
