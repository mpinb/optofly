# ==============================================================================
# OPTOFLY CONFIGURATION
# ==============================================================================
# Main configuration file for the OptoFly closed-loop optogenetics system
# Documentation: https://github.com/elhananby/OptoFly

# ==============================================================================
# SYSTEM CONFIGURATION
# ==============================================================================
[zmq]
# ZMQ messaging ports and topics
braid_port = 5555
trigger_port = 5556

braid_topic = "BRAID"
zone_enter_topic = "ZONE_ENTER"
zone_exit_topic = "ZONE_EXIT"

[logging]
# Global logging level
level = "INFO"

[monitoring]
active = true
host = "0.0.0.0"
port = 5000

# ==============================================================================
# TRACKING & DATA INPUT
# ==============================================================================

[braid_publisher]
# Braid tracking system connection
host = "127.0.0.1"
events_port = 8397     # Braid SSE/events endpoint (tracking data)
callback_port = 12345  # Braid UI endpoint (recording control)
timeout = 30
reconnect_delay = 5
experiments_path = "/mnt/data/experiments/"  # Root path where Braid saves .braid folders

[trigger_handler]
# Zone-based trigger detection
z_min = 0.10                     # Minimum z for trigger zone (meters)
z_max = 0.25                     # Maximum z for trigger zone (meters)
heading_cone_deg = 30.0          # Angular tolerance for heading alignment (degrees)
min_velocity = 0.01              # Minimum velocity to consider object "moving" (m/s)
max_velocity = 1.0               # Maximum velocity to filter noise (m/s)
min_tracking_age = 0.1           # Object must exist this long before triggering (seconds)
zone_timeout = 3.0               # Auto ZONE_EXIT if no updates for this long (seconds)
refractory_period = 10.0         # Global cooldown between ZONE_ENTER events (seconds)

[camera]
# High-speed camera settings
active = false
resolution = [2112, 2112]
fps = 500
exposure_time = 2000             # Microseconds
max_recording_time = 3.0         # Max seconds per recording (sizes buffer)

[camera.FOV]
# Camera field of view in tracking coordinates (meters)
x_min = -0.0218
x_max = 0.039
y_min = -0.025
y_max = 0.041

# ==============================================================================
# HARDWARE CONTROL
# ==============================================================================

[opto_trigger]
# LED optogenetic stimulation
active = false
port = "/dev/opto_trigger"
baudrate = 115200

# Stimulus parameters (single values or lists for randomization)
duration = [100, 200, 300]   # Pulse duration (ms)
# duration = [100, 200, 300, 400]  # Example: random selection

intensity = [  0,  51, 102, 153, 204, 255] # LED brightness (0-255)
# intensity = [128, 192, 255]    # Example: random intensity

frequency = 0                    # Pulse frequency (Hz, 0=continuous)
# frequency = [0, 10, 20, 50]    # Example: random frequency

color = "red"                    # LED color
sham_probability = 0.0           # Probability of sham trials (0.0-1.0)

[liquid_lens]
# Liquid lens auto-focus system (activates automatically with camera)
port = "/dev/optotune_ld"
mode = "diopter"
calibration_file = "calibrations/liquid_lens.csv"
# Zone timeout is global (from [trigger_handler] section)

# Predictor mode — controls how the lens target depth is computed each update:
#   "none"   — use raw z from Braid directly (no lookahead)
#   "linear" — z + vz * (system_latency + prediction_horizon)
#   "kalman" — 6-state Kalman filter with predictive lookahead
predictor = "none"

[liquid_lens.kalman]
# Prediction parameters — used by both "linear" and "kalman" predictor modes
process_noise = 0.01             # (kalman only) How quickly velocity can change
measurement_noise = 0.1          # (kalman only) Accuracy of position measurements
initial_covariance = 1.0         # (kalman only) Uncertainty in initial state
velocity_noise = 1.0             # (kalman only) Trust in Braid velocity estimates (lower = more trust)
system_latency = 0.010           # Message processing + serial write time (seconds) — calibrate with lens_latency_analyze
prediction_horizon = 0.010       # Additional lookahead beyond system_latency (seconds)

# ==============================================================================
# VISUAL STIMULI
# ==============================================================================
# Visual stimuli configuration has been moved to configs/visual_stimuli.toml
# This keeps system config clean and allows easy experiment preset swapping

[visual_stimuli]
# Enable/disable visual stimuli system
active = true

# Path to visual stimuli configuration file
config_file = "configs/visual_stimuli.toml"
