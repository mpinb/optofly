# ==============================================================================
# VISUAL STIMULI CONFIGURATION — Panda3D Pipeline
# ==============================================================================
# Copy to visual_stimuli.toml and customize for your rig.
#
# For the legacy pyglet pipeline, copy from visual_stimuli.pyglet.example.toml
# and set config_file = "configs/visual_stimuli.pyglet.toml" below.

[visual_stimuli]
active = true
log_file = "stim.csv"
log_level = "INFO"
log_color = "YELLOW"

# ------------------------------------------------------------------------------
# Arena geometry and Braid calibration
# ------------------------------------------------------------------------------

[visual_stimuli.arena]
viewing_distance_cm = 25.0            # Distance from fly to screen face (cm)
screen_width_cm = 52.7                # Physical width of one screen panel (cm)
num_screens = 4
window_x_offset = 3840                # X position of leftmost screen on the desktop
# Screen mapping: physical screens left-to-right → compass direction
# Valid directions: North, East, South, West
screen_mapping = ["South", "West", "North", "East"]
braid_heading_offset_rad = 0.0        # Braid heading that corresponds to North screen
braid_heading_flip = false            # True if Braid heading increases opposite to arena

# ------------------------------------------------------------------------------
# Stimulus: Background — textured walls + ground plane
# ------------------------------------------------------------------------------

[visual_stimuli.background]
enabled = true
square_size_px = 40                   # Square tile size in pixels
density = 0.5                         # Fraction of tiles filled (0.0–1.0)
background_color = [255, 255, 255]
foreground_color = [0, 0, 0]
seed = 42
cylinder_height_cm = 80               # Total height of the cylinder (z = ±height/2)

# ------------------------------------------------------------------------------
# Stimulus: Looming — expanding billboard disk
# ------------------------------------------------------------------------------

[visual_stimuli.looming]
enabled = true

# Size (degrees visual angle)
initial_size_deg = 5.0
final_size_deg = 72.0

# Timing (milliseconds)
expansion_duration_ms = 300
hold_time_ms = 200

# Expansion dynamics: "lv_ratio", "exponential", or "linear"
expansion_type = "exponential"
lv_ratio_ms = 25.0                    # Only used when expansion_type = "lv_ratio"

# Appearance
color = [0, 0, 0]                     # RGB (0–255)

# Position offsets from fly heading (degrees)
# 0 = ahead, 90 = right, -90 = left, 180 = behind
positions_deg = [-90, -45, 0, 45, 90]

# Sham trials: fraction of triggers with no stimulus (0.0–1.0)
sham_probability = 0.0

seed = 42                             # RNG seed for reproducible sequences
