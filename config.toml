[zmq]
braid_port = 5555
trigger_port = 5556

braid_topic = "BRAID"
trigger_topic = "TRIGGER"
lens_topic = "LENS"

[opto_trigger]
active = true
port = "/dev/ttyUSB0"
baudrate = 115200
duration = 300
intensity = 255
frequency = 0
sham_probability = 0.1

[liquid_lens]
active = true
port = "/dev/ttyUSB1"
mode = "diopter"
calibration_file = "calibrations/liquid_lens.csv"
tracking_timeout = 3.0

[liquid_lens.kalman]
enabled = true
process_noise = 0.01  # Process noise covariance (how quickly velocity can change)
measurement_noise = 0.1  # Measurement noise covariance (accuracy of position measurements)
initial_covariance = 1.0  # Initial state covariance (uncertainty in initial state)
system_latency = 0.05  # System latency in seconds (message processing + lens adjustment time)
prediction_horizon = 0.1  # How far in the future to predict (in seconds)

[braid_publisher]
url = "http://10.40.80.6:8397"
timeout = 30
reconnect_delay = 5

[trigger_handler]
min_trajectory_time = 1.0
min_trigger_interval = 10.0
radius = 0.025
z_lim = [0.15, 0.25]

[camera]
resolution = [2016, 2016]
fps = 500
exposure_time = 2000
pre_trigger_time = 0.5
post_trigger_time = 1.5

[camera.FOV]
x_min = -0.1
x_max = 0.1
y_min = -0.1
y_max = 0.1

[logging]
level = "INFO"