[zmq]
braid_port = 5555
trigger_port = 5556

braid_topic = "BRAID"
trigger_topic = "TRIGGER"
lens_topic = "LENS"

[opto_trigger]
active = true
port = "/dev/ttyUSB0"
baudrate = 115200

# Parameters can be single values OR lists of options
# Single value example:
duration = 300

# List of options example (randomly selected on each trigger):
# duration = [100, 200, 300, 400]

intensity = 255
# intensity = [128, 192, 255]

frequency = 0
# frequency = [0, 10, 20, 50]

color = "red"
sham_probability = 0.1

[liquid_lens]
active = true
port = "/dev/ttyUSB1"
mode = "diopter"
calibration_file = "calibrations/liquid_lens.csv"
tracking_timeout = 3.0

[liquid_lens.kalman]
enabled = true
process_noise = 0.01  # Process noise covariance (how quickly velocity can change)
measurement_noise = 0.1  # Measurement noise covariance (accuracy of position measurements)
initial_covariance = 1.0  # Initial state covariance (uncertainty in initial state)
system_latency = 0.05  # System latency in seconds (message processing + lens adjustment time)
prediction_horizon = 0.1  # How far in the future to predict (in seconds)

[braid_publisher]
url = "http://10.40.80.6:8397"
timeout = 30
reconnect_delay = 5

[trigger_handler]
min_trajectory_time = 1.0
min_trigger_interval = 10.0
radius = 0.025
z_lim = [0.15, 0.25]
heading_cone_deg = 45.0

[camera]
resolution = [2016, 2016]
fps = 500
exposure_time = 2000
pre_trigger_time = 0.5
post_trigger_time = 1.5

[camera.FOV]
x_min = -0.1
x_max = 0.1
y_min = -0.1
y_max = 0.1

[logging]
level = "INFO"

[visual_stimuli]
# Main settings
active = true
log_file = "visual_stimuli.csv"
performance_log_file = "visual_stimuli_performance.csv"
log_level = "INFO"
log_color = "CYAN"

# Display settings
window_x_offset = 3840             # Start of experimental screens (DP-0.1)
window_width = 7680                # Total width (4 × 1920)
window_height = 1080
target_fps = 240

# Calibration
use_empirical_calibration = false  # Set to true after running --calibrate-mapping
calibration_mapping_file = "calibrations/heading_mapping_model.npz"
heading_offset_deg = 0.0           # Fallback offset if empirical unavailable
arena_center_to_screen_cm = 25.0   # Distance from arena center to screens

# Screen identification (set after --calibrate)
# Order: DP-0.1, DP-0.2, DP-2.1, DP-2.2
screen_mapping = ["North", "East", "South", "West"]

[visual_stimuli.static]
enabled = true
square_color = "black"              # Color for 1s in binary matrix
background_color = "white"          # Color for 0s in binary matrix
pattern_density = 0.3               # Probability of pattern pixels (0.0-1.0)
downscale_factor = 2                # Resolution divisor: 1=full, 2=half, 4=quarter
random_seed = 42                    # Optional: for reproducible patterns

# OLD parameters (no longer used):
# num_squares = 500
# average_square_size_px = 50
# square_size_std_px = 15

[visual_stimuli.looming]
enabled = true

# Parameters can be single values OR lists of options
# Single value example:
initial_size_deg = 5.0

# List of options example (randomly selected on each trigger):
# initial_size_deg = [5.0, 10.0, 15.0]

final_size_deg = 80.0
# final_size_deg = [60.0, 70.0, 80.0, 90.0]

expansion_duration_ms = 500
# expansion_duration_ms = [300, 400, 500, 600]

hold_time_ms = 200
# hold_time_ms = [100, 200, 300]

# Other parameters (unchanged)
expansion_type = "lv_ratio"        # "lv_ratio" or "exponential"
lv_ratio_ms = 40.0
circle_color = [0, 0, 0]
positions_deg = [-90, 0, 90]       # Offsets from fly heading

[visual_stimuli.standalone]
# Standalone testing mode settings (--standalone flag)
window_width = 1280                # Small window width
window_height = 720                # Small window height
scale_factor = 6.0                 # Coordinate scaling factor (7680 / 1280 = 6)
show_overlay = true                # Enable debug overlay
