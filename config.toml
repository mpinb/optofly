# ==============================================================================
# OPTOFLY CONFIGURATION
# ==============================================================================
# Main configuration file for the OptoFly closed-loop optogenetics system
# Documentation: https://github.com/elhananby/OptoFly

# ==============================================================================
# SYSTEM CONFIGURATION
# ==============================================================================

[zmq]
# ZMQ messaging ports and topics
braid_port = 5555
trigger_port = 5556

braid_topic = "BRAID"
trigger_topic = "TRIGGER"
lens_topic = "LENS"

[logging]
# Global logging level
level = "INFO"

# ==============================================================================
# TRACKING & DATA INPUT
# ==============================================================================

[braid_publisher]
# Braid tracking system connection
url = "http://127.0.0.1:8397"
timeout = 30
reconnect_delay = 5
experiments_path = "/mnt/data/experiments/"  # Root path where Braid saves .braid folders

[trigger_handler]
# Trigger detection criteria
min_trajectory_time = 1.0        # Minimum tracking time before triggering (seconds)
min_trigger_interval = 10.0      # Minimum time between triggers (seconds)
radius = 0.05                   # Trigger zone radius (meters)
z_lim = [0.15, 0.25]            # Vertical trigger zone limits (meters)
heading_cone_deg = 45.0          # Angular tolerance for heading alignment (degrees)
min_velocity = 0.01              # Minimum velocity to consider object "moving" (m/s)

[camera]
# High-speed camera settings
active = false
resolution = [2016, 2016]
fps = 500
exposure_time = 2000             # Microseconds
pre_trigger_time = 0.5           # Recording before trigger (seconds)
post_trigger_time = 1.5          # Recording after trigger (seconds)

[camera.FOV]
# Camera field of view in tracking coordinates (meters)
x_min = -0.07
x_max = 0.07
y_min = -0.045
y_max = 0.06

# ==============================================================================
# HARDWARE CONTROL
# ==============================================================================

[opto_trigger]
# LED optogenetic stimulation
active = true
port = "/dev/opto_trigger"
baudrate = 115200

# Stimulus parameters (single values or lists for randomization)
duration = [100, 200, 300]   # Pulse duration (ms)
# duration = [100, 200, 300, 400]  # Example: random selection

intensity = [  0,  51, 102, 153, 204, 255] # LED brightness (0-255)
# intensity = [128, 192, 255]    # Example: random intensity

frequency = 0                    # Pulse frequency (Hz, 0=continuous)
# frequency = [0, 10, 20, 50]    # Example: random frequency

color = "red"                    # LED color
sham_probability = 0.1           # Probability of sham trials (0.0-1.0)

[liquid_lens]
# Liquid lens auto-focus system
active = false
port = "/dev/ttyUSB1"
mode = "diopter"
calibration_file = "calibrations/liquid_lens.csv"
tracking_timeout = 3.0           # Stop adjusting if no tracking data (seconds)

[liquid_lens.kalman]
# Kalman filter for predictive focus
enabled = false
process_noise = 0.01             # How quickly velocity can change
measurement_noise = 0.1          # Accuracy of position measurements
initial_covariance = 1.0         # Uncertainty in initial state
system_latency = 0.05            # Message processing + lens adjustment time (seconds)
prediction_horizon = 0.1         # Prediction lookahead time (seconds)

# ==============================================================================
# VISUAL STIMULI
# ==============================================================================

[visual_stimuli]
# Main visual stimuli settings
active = false
log_file = "visual_stimuli.csv"
performance_log_file = "visual_stimuli_performance.csv"
log_level = "INFO"
log_color = "CYAN"

# ------------------------------------------------------------------------------
# Display Configuration
# ------------------------------------------------------------------------------

window_x_offset = 3840           # Start of experimental screens (DP-0.1)
window_width = 7680              # Total width: 4 screens × 1920 pixels
window_height = 1080
target_fps = 240

# Screen identification (set after running --calibrate)
# Order corresponds to: DP-0.1, DP-0.2, DP-2.1, DP-2.2
screen_mapping = ["South", "West", "North", "East"]

# ------------------------------------------------------------------------------
# Calibration Settings
# ------------------------------------------------------------------------------

use_empirical_calibration = false  # Enable after running --calibrate-mapping
calibration_mapping_file = "calibrations/heading_mapping_model.npz"
heading_offset_deg = 0.0           # Fallback offset if empirical unavailable
arena_center_to_screen_cm = 25.0   # Distance from arena center to screens

# ------------------------------------------------------------------------------
# Stimulus: Static Pattern
# ------------------------------------------------------------------------------

[visual_stimuli.static]
enabled = true
square_color = "black"           # Pattern color
background_color = "white"       # Background color
pattern_density = 0.3            # Pattern density (0.0-1.0)
downscale_factor = 2             # Resolution divisor: 1=full, 2=half, 4=quarter
random_seed = 42                 # For reproducible patterns

# ------------------------------------------------------------------------------
# Stimulus: Looming Circles
# ------------------------------------------------------------------------------

[visual_stimuli.looming]
enabled = false

# Size parameters (degrees visual angle)
initial_size_deg = 5.0
# initial_size_deg = [5.0, 10.0, 15.0]  # Example: randomization

final_size_deg = 64.0
# final_size_deg = [60.0, 70.0, 80.0, 90.0]

# Timing parameters (milliseconds)
expansion_duration_ms = 500
# expansion_duration_ms = [300, 400, 500, 600]

hold_time_ms = 200
# hold_time_ms = [100, 200, 300]

# Expansion dynamics
expansion_type = "exponential"   # "lv_ratio" or "exponential"
lv_ratio_ms = 25.0               # Only used if expansion_type = "lv_ratio"

# Appearance
circle_color = [0, 0, 0]         # RGB color (black)

# Position offsets (degrees from fly heading)
# 0° = ahead, 90° = right, -90° = left, 180° = behind
positions_deg = [-90, 0, 90]

# ------------------------------------------------------------------------------
# Stimulus: Vertical Bar
# ------------------------------------------------------------------------------

[visual_stimuli.vertical_bar]
enabled = false

# Bar appearance
bar_width_deg = 20.0             # Width in visual degrees
# bar_width_deg = [15.0, 20.0, 25.0]  # Example: randomization

bar_color = "black"              # Color name or RGB list [R, G, B]
bar_height_fraction = 1.0        # Height as fraction of screen (1.0 = full height)

# Timing parameters (milliseconds)
presentation_duration_ms = 2000
# presentation_duration_ms = [1000, 2000, 3000]

cooldown_duration_ms = 3000
# cooldown_duration_ms = [2000, 3000, 4000]

# Position offsets (degrees from fly heading)
# System automatically balances presentations across positions
# 0° = ahead, 90° = right, -90° = left, 180° = behind
positions_deg = [90, 0, 180]

# ------------------------------------------------------------------------------
# Stimulus: Sweeping Bar
# ------------------------------------------------------------------------------

[visual_stimuli.sweeping_bar]
enabled = false

# Sweep mode: "basic_sweep", "front_hemisphere", "lateral_sweep", or "custom"
sweep_mode = "basic_sweep"

# Bar appearance
bar_width_deg = 20.0             # Width in visual degrees
bar_color = "black"
bar_height_fraction = 1.0

# Motion parameters
sweep_speed_deg_per_sec = 15.0   # Angular velocity (degrees/second)
# sweep_speed_deg_per_sec = [10, 15, 22.5, 30]  # Example: randomization

sweep_directions = ["forward"]   # ["forward"], ["reverse"], or ["forward", "reverse"]

# Timing
pause_at_start_ms = 500          # Pause before sweeping (0 to start immediately)
pause_at_end_ms = 500            # Pause after sweeping
cooldown_duration_ms = 3000

# Sweep mode parameters
basic_sweep_start_deg = 45.0     # Used with sweep_mode = "basic_sweep"
basic_sweep_end_deg = 90.0

front_hemisphere_start_deg = 0.0     # Used with sweep_mode = "front_hemisphere"
front_hemisphere_end_deg = 90.0

lateral_sweep_start_deg = 45.0   # Used with sweep_mode = "lateral_sweep"
lateral_sweep_end_deg = 135.0

custom_start_deg = 0.0           # Used with sweep_mode = "custom"
custom_end_deg = 180.0

# Optional: Define multiple angular sectors (overrides sweep_mode)
# angular_sectors = [[45, 90], [0, 45], [-90, -45]]  # Balanced presentation

# Advanced
log_every_frame = false          # Frame-by-frame logging (WARNING: large files!)

# ------------------------------------------------------------------------------
# Standalone Testing Mode
# ------------------------------------------------------------------------------

[visual_stimuli.standalone]
# Settings for manual testing mode (--standalone flag)
use_experimental_display = true  # Render on experimental display vs small test window
window_width = 1280              # Small window width (only if use_experimental_display = false)
window_height = 720              # Small window height (only if use_experimental_display = false)
scale_factor = 6.0               # Coordinate scaling (7680/1280 = 6, only if use_experimental_display = false)
show_overlay = true              # Enable debug overlay with heading info
