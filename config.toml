[zmq]
braid_port = 5555
trigger_port = 5556

braid_topic = "BRAID"
trigger_topic = "TRIGGER"
lens_topic = "LENS"

[opto_trigger]
active = true
port = "/dev/ttyUSB0"
baudrate = 115200

# Parameters can be single values OR lists of options
# Single value example:
duration = 300

# List of options example (randomly selected on each trigger):
# duration = [100, 200, 300, 400]

intensity = 255
# intensity = [128, 192, 255]

frequency = 0
# frequency = [0, 10, 20, 50]

color = "red"
sham_probability = 0.1

[liquid_lens]
active = true
port = "/dev/ttyUSB1"
mode = "diopter"
calibration_file = "calibrations/liquid_lens.csv"
tracking_timeout = 3.0

[liquid_lens.kalman]
enabled = true
process_noise = 0.01  # Process noise covariance (how quickly velocity can change)
measurement_noise = 0.1  # Measurement noise covariance (accuracy of position measurements)
initial_covariance = 1.0  # Initial state covariance (uncertainty in initial state)
system_latency = 0.05  # System latency in seconds (message processing + lens adjustment time)
prediction_horizon = 0.1  # How far in the future to predict (in seconds)

[braid_publisher]
url = "http://10.40.80.6:8397"
timeout = 30
reconnect_delay = 5

[trigger_handler]
min_trajectory_time = 1.0
min_trigger_interval = 10.0
radius = 0.025
z_lim = [0.15, 0.25]
heading_cone_deg = 45.0

[camera]
resolution = [2016, 2016]
fps = 500
exposure_time = 2000
pre_trigger_time = 0.5
post_trigger_time = 1.5

[camera.FOV]
x_min = -0.1
x_max = 0.1
y_min = -0.1
y_max = 0.1

[logging]
level = "INFO"

[visual_stimuli]
# Main settings
active = true
log_file = "visual_stimuli.csv"
performance_log_file = "visual_stimuli_performance.csv"
log_level = "INFO"
log_color = "CYAN"

# Display settings
window_x_offset = 3840             # Start of experimental screens (DP-0.1)
window_width = 7680                # Total width (4 × 1920)
window_height = 1080
target_fps = 240

# Calibration
use_empirical_calibration = false  # Set to true after running --calibrate-mapping
calibration_mapping_file = "calibrations/heading_mapping_model.npz"
heading_offset_deg = 0.0           # Fallback offset if empirical unavailable
arena_center_to_screen_cm = 25.0   # Distance from arena center to screens

# Screen identification (set after --calibrate)
# Order: DP-0.1, DP-0.2, DP-2.1, DP-2.2
screen_mapping = ["North", "East", "South", "West"]

[visual_stimuli.static]
enabled = true
square_color = [0, 0, 0]           # RGB tuple or color name
background_color = [255, 255, 255]
average_square_size_px = 50
square_size_std_px = 15
num_squares = 500
random_seed = 42                 # null for random, int for reproducible

[visual_stimuli.looming]
enabled = true

# Parameters can be single values OR lists of options
# Single value example:
initial_size_deg = 5.0

# List of options example (randomly selected on each trigger):
# initial_size_deg = [5.0, 10.0, 15.0]

final_size_deg = 80.0
# final_size_deg = [60.0, 70.0, 80.0, 90.0]

expansion_duration_ms = 500
# expansion_duration_ms = [300, 400, 500, 600]

hold_time_ms = 200
# hold_time_ms = [100, 200, 300]

# Other parameters (unchanged)
expansion_type = "lv_ratio"        # "lv_ratio" or "exponential"
lv_ratio_ms = 40.0
circle_color = [0, 0, 0]
positions_deg = [-90, 0, 90]       # Offsets from fly heading

[visual_stimuli.vertical_bar]

# ========================================
# BASIC SETTINGS
# ========================================

# Enable/disable this stimulus
enabled = true

# ========================================
# BAR APPEARANCE
# ========================================

# Bar width in visual degrees (angular size as seen by fly)
# Can be single value or list for randomization
# Examples:
#   bar_width_deg = 20.0           # Always 20 degrees
#   bar_width_deg = [15.0, 20.0, 25.0]  # Random selection
bar_width_deg = 20.0

# Bar color
# Can be color name: "black", "white", "red", "green", "blue", "gray"
# Or RGB list: [255, 0, 0] for red
bar_color = "black"

# Bar height as fraction of screen height
# 1.0 = full height (floor to ceiling)
# 0.5 = half height
bar_height_fraction = 1.0

# ========================================
# TIMING PARAMETERS
# ========================================

# How long to display the bar (milliseconds)
# Can be single value or list for randomization
# Examples:
#   presentation_duration_ms = 2000        # Always 2 seconds
#   presentation_duration_ms = [1000, 2000, 3000]  # Random 1-3 seconds
presentation_duration_ms = 2000

# Cooldown period after presentation (milliseconds)
# Prevents immediate re-triggering
# Can be single value or list for randomization
cooldown_duration_ms = 3000

# ========================================
# POSITION CONFIGURATION
# ========================================

# Possible positions for bar presentation (degrees relative to fly heading)
# The system will balance presentations across these positions
# 
# Position meanings:
#   0° = directly ahead of fly
#   90° = to fly's right (lateral/attractive test)
#   -90° = to fly's left (lateral/attractive test)
#   180° = directly behind fly (control)
#   45° = front-right diagonal
#   -45° = front-left diagonal
#
# Examples:
#   positions_deg = [90]              # Only right side
#   positions_deg = [90, 0, 180]      # Right, ahead, behind
#   positions_deg = [90, -90]         # Both sides
#   positions_deg = [0, 45, 90, 135, 180, -135, -90, -45]  # All around
positions_deg = [90, 0, 180]

# ========================================
# EXAMPLE CONFIGURATIONS FOR DIFFERENT EXPERIMENTS
# ========================================

# Configuration 1: Test lateral attraction (right side only)
# enabled = true
# bar_width_deg = 20.0
# bar_color = "black"
# presentation_duration_ms = 2000
# positions_deg = [90]

# Configuration 2: Test attraction vs control (right and behind)
# enabled = true
# bar_width_deg = 20.0
# bar_color = "black"
# presentation_duration_ms = 2000
# positions_deg = [90, 180]

# Configuration 3: Full spatial test (all cardinal directions)
# enabled = true
# bar_width_deg = 20.0
# bar_color = "black"
# presentation_duration_ms = 2000
# positions_deg = [0, 90, 180, -90]

# Configuration 4: Randomized parameters
# enabled = true
# bar_width_deg = [15.0, 20.0, 25.0]
# bar_color = "black"
# presentation_duration_ms = [1000, 2000, 3000]
# cooldown_duration_ms = [2000, 3000, 4000]
# positions_deg = [90, 0, 180]

# Configuration 5: Colored bars for different conditions
# enabled = true
# bar_width_deg = 20.0
# bar_color = [0, 128, 255]  # Custom blue color
# presentation_duration_ms = 2000
# positions_deg = [90, -90]