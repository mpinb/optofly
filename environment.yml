name: optofly_env
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python>=3.12

  # Core dependencies
  - matplotlib>=3.10.3
  - numpy>=2.2.5
  - pyglet>=2.1.9
  - pyserial>=3.5
  - pyzmq>=26.4.0
  - requests>=2.32.3
  - scipy>=1.15.3

  # Development dependencies
  - pytest>=8.4.2
  - ruff

  # Additional dependencies via pip (not available in conda)
  - pip
  - pip:
      - rerun-sdk>=0.23.2
      - tomli-w>=1.1.0
